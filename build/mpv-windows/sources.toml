# Every source the Windows libmpv build uses, pinned. Read by build.py and check.py.
#
# A source is either a release tarball checked by SHA-256 (`url`, `sha256`) or a git commit fetched at depth 1 and checked by its
# commit id (`git`, `tag`, `commit`) where upstream publishes no release tarball. `licence` is the licence we use the component under
# (an SPDX expression); `shipped = false` marks tools and generators that are not part of the DLL set. `licence_files` are copied
# into the output, relative to the source root. `into` places a source inside another one (submodules and bundled dependencies).
#
# Changing anything here changes the cache key in .github/workflows/mpv-windows.yml, so the whole set is rebuilt.

# ---- Build tools (not shipped) ----

