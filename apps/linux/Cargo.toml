# D8 spike: a throwaway GTK4 + libadwaita prototype on current-app, with libmpv in a GtkGLArea (docs/notes/linux-gtk.md).
# Its own workspace on purpose: the root workspace, its lockfile, cargo-deny and CI never see these prototype-only crates. Removed
# before the spike's PR merges.
[package]
name = "current-linux-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
current-app = { path = "../../crates/app" }
current-model = { path = "../../crates/model" }
# Prototype only, approved by the owner for this spike (2026-10-22). Features match Ubuntu 24.04: GTK 4.14.5, libadwaita 1.5.0.
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_14"] }
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_5"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "sync", "time"] }

[lints.rust]
# `deny` rather than the root's `forbid` so that `src/mpv.rs`, the only FFI, can allow it.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
