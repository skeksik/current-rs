# cargo-deny configuration: what may ship in a distributed build (ADR 0003). Run `cargo deny check`.
# A new licence or exception needs the owner's approval and changes ADR 0003 in the same PR.

[graph]
all-features = true

[licenses]
# Permissive licences only. LGPL libraries (FFmpeg, libmpv, GTK) are not crates we link statically; they ship as dynamic libraries
# outside this check. MPL-2.0 is allowed only through the per-crate exceptions below.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The list is the policy, not what is in use today.
unused-allowed-license = "allow"
# Exceptions (ADR 0003), crate by crate.
exceptions = [
    # UniFFI (MPL-2.0): the bridge to C# and Swift. uniffi_bindgen and uniffi_udl are reached only through the Swift generator tool
    # (tools/uniffi-bindgen); the rest are built into current-ffi.
    { allow = ["MPL-2.0"], crate = "uniffi" },
    { allow = ["MPL-2.0"], crate = "uniffi_bindgen" },
    { allow = ["MPL-2.0"], crate = "uniffi_core" },
    { allow = ["MPL-2.0"], crate = "uniffi_internal_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_meta" },
    { allow = ["MPL-2.0"], crate = "uniffi_pipeline" },
    { allow = ["MPL-2.0"], crate = "uniffi_udl" },
]

# Our own crates are proprietary and unpublished (no licence field).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# RustSec advisories for every crate in the graph; unmaintained crates are reported for the whole graph.
unmaintained = "all"
yanked = "deny"
ignore = [
    # Re-check on the next uniffi bump (ADR 0004). current-ffi itself does not contain basic-toml (cargo tree -p current-ffi -e normal).
    { id = "RUSTSEC-2026-0374", reason = "basic-toml: unmaintained, reached only through uniffi_bindgen in the Swift generator tool (tools/uniffi-bindgen), not shipped; goes with the next uniffi bump" },
]
