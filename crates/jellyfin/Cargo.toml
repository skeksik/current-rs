[package]
name = "current-jellyfin"
description = "Jellyfin client: server setup (address parsing, probing, identity), local discovery, sign-in and browsing; wire types stay private."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
current-model.workspace = true
current-net.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }

[lints]
workspace = true
