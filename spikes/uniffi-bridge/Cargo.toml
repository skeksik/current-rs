# D1 spike (docs/notes/uniffi-bridge.md). Its own Cargo workspace on purpose: the main workspace, its lockfile and cargo-deny
# stay untouched. Deleted before merge; the real bridge is crates/ffi (ADR 0002).
[workspace]
resolver = "3"
members = ["bridge", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Exact versions, approved for D1. uniffi follows uniffi-bindgen-cs: v0.11.1+v0.31.0 resolves uniffi 0.31.0 in its Cargo.lock.
[workspace.dependencies]
tokio = { version = "=1.54.1", default-features = false }
uniffi = { version = "=0.31.0", default-features = false }

# As in the main workspace. UniFFI's proc-macro output passes this (checked with uniffi 0.31.0), so the bridge crate
# needs no exception.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
