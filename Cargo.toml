[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Every third-party crate is declared here only, with an exact version ("=x.y.z"), after the owner approves it.
# Member crates then use `name.workspace = true`.
[workspace.dependencies]
current-app = { path = "crates/app" }
current-jellyfin = { path = "crates/jellyfin" }
current-model = { path = "crates/model" }
current-mpv = { path = "crates/mpv" }
current-net = { path = "crates/net" }
current-playback = { path = "crates/playback" }
current-relay = { path = "crates/relay" }
current-store = { path = "crates/store" }
jellyfin-stand-in = { path = "tools/jellyfin-stand-in" }

apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
bytes = "=1.12.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }
getrandom = "=0.4.3"
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
keyring-core = "=1.0.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = "=1.0.229"
serde_json = "=1.0.154"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", default-features = false }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
tracing = "=0.1.44"
uniffi = { version = "=0.31.0", default-features = false }
url = "=2.5.8"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
